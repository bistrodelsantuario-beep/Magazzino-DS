<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#788469"><link rel="manifest" href="manifest.json"><title>Magazzino DS</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div style="font-family:system-ui;padding:24px;text-align:center">Apertura Magazzino DS…</div><script>(async()=>{const files=["app-1.txt","app-2.txt","app-3.txt","app-4.txt"];let b='';for(const f of files){const r=await fetch(f+'?v=3',{cache:'no-store'});if(!r.ok)throw new Error(f);b+=await r.text();}const u=Uint8Array.from(atob(b.replace(/\s+/g,'')),c=>c.charCodeAt(0));const t=new TextDecoder().decode(pako.ungzip(u));document.open();document.write(t);document.close()})().catch(e=>{console.error(e);document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Errore apertura app. Ricarica la pagina.</p>'})</script></body></html>
