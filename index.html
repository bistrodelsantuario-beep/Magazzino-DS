<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#788469"><link rel="manifest" href="manifest.json"><title>Magazzino DS</title></head><body><div style="font-family:system-ui;padding:24px;text-align:center">Apertura Magazzino DS…</div><script>(async()=>{const files=["app-1.txt", "app-2.txt", "app-3.txt", "app-4.txt"];let b='';for(const f of files)b+=await(await fetch(f)).text();const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Errore apertura app. Ricarica la pagina.</p>')</script></body></html>
